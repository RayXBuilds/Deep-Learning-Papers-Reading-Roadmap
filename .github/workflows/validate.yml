name: Validate learning content
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs
            notes
            experiments
            scripts
            templates
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate local links, notes and baseline provenance
        run: python scripts/check_content.py
      - name: Check mechanisms against independent expectations
        run: python -m unittest discover -s experiments -p 'test_*.py' -v
      - name: Run mechanism experiments
        run: python experiments/run.py --experiment all --seed 7 --output /tmp/roadmap-ci.json
      - name: Run additive attention and padding checks
        run: python experiments/additive_attention.py --output /tmp/additive-attention-ci.json
      - name: Run VAE objective and generation evaluation checks
        run: python experiments/vae_objectives.py --output /tmp/vae-objectives-ci.json
      - name: Run AdamW and L2 regularization checks
        run: python experiments/adamw_decay.py --output /tmp/adamw-decay-ci.json
      - name: Run LoRA initialization, gradient and merge checks
        run: python experiments/lora_mechanics.py --output /tmp/lora-mechanics-ci.json
      - name: Run ViT patch and position permutation checks
        run: python experiments/vit_patches.py --output /tmp/vit-patches-ci.json
      - name: Run BERT MLM supervision checks
        run: python experiments/bert_mlm.py --output /tmp/bert-mlm-ci.json
      - name: Run CLIP paired objective checks
        run: python experiments/clip_objective.py --output /tmp/clip-objective-ci.json
      - name: Run GAN objective and gradient checks
        run: python experiments/gan_objective.py --output /tmp/gan-objective-ci.json
      - name: Run Wasserstein geometry checks
        run: python experiments/wasserstein_geometry.py --output /tmp/wasserstein-geometry-ci.json
      - name: Run EBGAN energy and pulling-away checks
        run: python experiments/ebgan_energy.py --output /tmp/ebgan-energy-ci.json
      - name: Run EBGAN dimension controls
        run: python experiments/ebgan_dimension.py --output /tmp/ebgan-dimension-ci.json
      - name: Run DualCast region checks
        run: python experiments/dualcast_regions.py --output /tmp/dualcast-regions-ci.json
      - name: Run Flow Matching velocity and time direction checks
        run: python experiments/flow_matching.py --output /tmp/flow-matching-ci.json
      - name: Run Flow Matching mixture controls
        run: python experiments/flow_mixture.py --output /tmp/flow-mixture-ci.json
      - name: Run robust flow residual and score controls
        run: python experiments/robust_flow.py --output /tmp/robust-flow-ci.json
      - name: Run TRS score buffer controls
        run: python experiments/trs_buffer.py --output /tmp/trs-buffer-ci.json
      - name: Run restoration input sensitivity controls
        run: python experiments/restoration_stability.py --output /tmp/restoration-stability-ci.json
      - name: Run principal Euler error controls
        run: python experiments/euler_error.py --output /tmp/euler-error-ci.json
      - name: Run Gaussian potential-flow controls
        run: python experiments/potential_gaussian.py --output /tmp/potential-gaussian-ci.json
      - name: Run residual activation and cancellation controls
        run: python experiments/residual_gate.py --output /tmp/residual-gate-ci.json
      - name: Run BatchNorm derivative and frozen-statistic controls
        run: python experiments/bn_jacobian.py --output /tmp/bn-jacobian-ci.json

      - name: Verify recorded dropout and convolution results
        run: |
          python experiments/early_mechanisms.py > /tmp/early-mechanisms-ci.json
          diff experiments/results/early-mechanisms.json /tmp/early-mechanisms-ci.json
      - name: Check linear convolution and pyramid routing
        run: python experiments/vision_operators.py
      - name: Recompute XLNet visibility and T5 span lengths
        run: |
          python experiments/pretraining_layouts.py > /tmp/pretraining-layouts.json
          diff -u experiments/results/pretraining-layouts.json /tmp/pretraining-layouts.json
      - name: Check SimCLR and MAE mechanism reports
        run: |
          python experiments/view_candidates.py > /tmp/view-candidates.json
          python experiments/masked_patches.py > /tmp/masked-patches.json
      - name: Check tiled attention and preference odds
        run: |
          python experiments/attention_tiles.py
          python experiments/preference_odds.py
      - name: Run SSD duality and masked-loss controls
        run: |
          python experiments/ssd_duality.py
          python experiments/llada_weight.py
