name: Validate learning content
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs
            notes
            experiments
            scripts
            templates
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate local links, notes and baseline provenance
        run: python scripts/check_content.py
      - name: Check mechanisms against independent expectations
        run: python -m unittest discover -s experiments -p 'test_*.py' -v
      - name: Run mechanism experiments
        run: python experiments/run.py --experiment all --seed 7 --output /tmp/roadmap-ci.json
      - name: Run additive attention and padding checks
        run: python experiments/additive_attention.py --output /tmp/additive-attention-ci.json
      - name: Run VAE objective and generation evaluation checks
        run: python experiments/vae_objectives.py --output /tmp/vae-objectives-ci.json
      - name: Run AdamW and L2 regularization checks
        run: python experiments/adamw_decay.py --output /tmp/adamw-decay-ci.json
      - name: Run LoRA initialization, gradient and merge checks
        run: python experiments/lora_mechanics.py --output /tmp/lora-mechanics-ci.json
      - name: Run ViT patch and position permutation checks
        run: python experiments/vit_patches.py --output /tmp/vit-patches-ci.json
      - name: Run BERT MLM supervision checks
        run: python experiments/bert_mlm.py --output /tmp/bert-mlm-ci.json
      - name: Run CLIP paired objective checks
        run: python experiments/clip_objective.py --output /tmp/clip-objective-ci.json
      - name: Run GAN objective and gradient checks
        run: python experiments/gan_objective.py --output /tmp/gan-objective-ci.json
      - name: Run Wasserstein geometry checks
        run: python experiments/wasserstein_geometry.py --output /tmp/wasserstein-geometry-ci.json
